{% extends "base.html" %}

{% block title %}Mock Application Form 1 — ApplyEase{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Software Engineer Application (Standard Form)</h4>
        </div>
        <div class="card-body p-4">
          <form id="mockForm1" method="post">
            {% csrf_token %}
            <div class="row g-3">
              <div class="col-md-6">
                <label for="first_name" class="form-label">First Name</label>
                <input type="text" class="form-control" id="first_name" name="first_name" placeholder="Jane" required>
              </div>
              <div class="col-md-6">
                <label for="last_name" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="last_name" name="last_name" placeholder="Doe" required>
              </div>
              <div class="col-md-6">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="jane@example.com" required>
              </div>
              <div class="col-md-6">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="phone" name="phone" placeholder="+1 555 123 4567">
              </div>
              <div class="col-12">
                <label for="linkedin" class="form-label">LinkedIn Profile</label>
                <input type="url" class="form-control" id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/janedoe">
              </div>
              <div class="col-md-6">
                <label for="university" class="form-label">University / Institution</label>
                <input type="text" class="form-control" id="university" name="university" placeholder="MIT">
              </div>
              <div class="col-md-6">
                <label for="degree" class="form-label">Degree</label>
                <input type="text" class="form-control" id="degree" name="degree" placeholder="B.S. Computer Science">
              </div>
              <div class="col-12">
                <label for="skills" class="form-label">Skills</label>
                <input type="text" class="form-control" id="skills" name="skills" placeholder="Python, Django, React">
              </div>
              <div class="col-12">
                <label for="cover_letter" class="form-label">Cover Letter</label>
                <textarea class="form-control" id="cover_letter" name="cover_letter" rows="5" placeholder="Why are you a great fit for this role?"></textarea>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary px-4">Submit Application</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
